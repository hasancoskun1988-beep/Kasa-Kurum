name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.x'
        channel: 'stable'

    - name: Recreate Android Directory (Fix Missing build.gradle)
      run: |
        flutter create . --platforms=android --project-name=kurum_kasa --org=com.kurumkasa.app

    - name: Install Dependencies
      run: flutter pub get

    - name: Build APK
      run: flutter build apk --release
