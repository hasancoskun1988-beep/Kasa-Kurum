name: Flutter Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Clone Repo Manually
      run: |
        git clone https://github.com/${{ github.repository }}.git .
        git checkout ${{ github.ref_name }}

    - name: Install Java 17
      run: |
        sudo apt-get update
        sudo apt-get install -y openjdk-17-jdk
        java -version

    - name: Set up Flutter SDK
      run: |
        git clone https://github.com/flutter/flutter.git -b 3.22.2 --depth 1 ~/flutter
        echo "$HOME/flutter/bin" >> $GITHUB_PATH

    - name: Verify Flutter
      run: flutter --version

    - name: Get Dependencies
      run: flutter pub get

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK via Script
      run: |
        mkdir -p artifact
        cp build/app/outputs/flutter-apk/app-release.apk artifact/app-release.apk
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: artifact/app-release.apk
