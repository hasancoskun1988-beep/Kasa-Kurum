name: Flutter Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Clone Repository Manually
      run: |
        git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git .
        git checkout ${{ github.ref_name }}

    - name: Set up Java 17
      run: |
        sudo apt-get update
        sudo apt-get install -y openjdk-17-jdk
        java -version

    - name: Set up Flutter SDK
      run: |
        git clone https://github.com/flutter/flutter.git -b 3.22.2 --depth 1 ~/flutter
        echo "$HOME/flutter/bin" >> $GITHUB_PATH

    - name: Verify Flutter
      run: flutter --version

    - name: Get Dependencies
      run: flutter pub get

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK as Artifact
      run: |
        # APK dosyasını geçici bir klasöre kopyalayıp GitHub API ile yüklüyoruz veya curl kullanıyoruz
        # En kolayı actions/upload-artifact yerine curl veya script tabanlı yükleme yapmaktır.
