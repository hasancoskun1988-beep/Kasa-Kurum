name: kurum_kasa
description: "Kurum Kasa ve Personel Takip Uygulamasi"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  image_path: "assets/icon.jpg"
  android: true
  ios: false # iOS'u kapatıyoruz, sadece Android için üretecek

flutter:
  uses-material-design: true
  assets:
    - assets/icon.jpg
